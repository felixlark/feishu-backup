[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-backup"
version = "0.1.0"
description = "A practical Feishu knowledge base backup workflow built on top of feishu-docx."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Longbiao" }
]
dependencies = [
  "feishu-docx",
  "httpx>=0.27.0",
  "pydantic>=2.0.0,<3.0.0",
  "pypinyin>=0.53.0",
]
keywords = ["feishu", "backup", "wiki", "knowledge-base", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/felixlark/feishu-backup"
Repository = "https://github.com/felixlark/feishu-backup"
Issues = "https://github.com/felixlark/feishu-backup/issues"

[project.scripts]
feishu-backup = "feishu_backup:main"

[tool.setuptools]
py-modules = ["feishu_backup"]
